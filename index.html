<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>로그인 테스트</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="auth">
    <input id="email" type="email" placeholder="이메일">
    <input id="password" type="password" placeholder="비밀번호">
    <button onclick="signIn()">로그인</button>
    <div id="msg"></div>
  </div>
  <script>
    const SUPABASE_URL = "https://mtwbkypkhmaxafqbigpc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_AUCv5Ggnlr0bErHC0uLtDg_6G2Utj3D";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function signIn() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      console.log("Login attempt:", email);
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        document.getElementById('msg').textContent = "에러: " + error.message;
        console.error("Error:", error);
      } else {
        document.getElementById('msg').textContent = "로그인 성공!";
        console.log("Success:", data);
      }
    }
  </script>
</body>
</html>
