<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘의 루틴</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f7f5;color:#202020;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}
.app{max-width:760px;margin:auto;padding:28px 18px 90px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
h1{font-size:28px;margin:0 0 6px}
.date{color:#777}
.score{font-size:28px;font-weight:750}
.card{background:white;border:1px solid #e8e8e4;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 3px 14px #00000008}
.timeline{position:relative}
.item{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid #eee}
.item:last-child{border-bottom:0}
.time{color:#777;font-size:14px;padding-top:4px}
.item-title{font-weight:650}
.meta{font-size:13px;color:#888;margin-top:5px}
.badge{display:inline-block;margin-top:7px;padding:5px 8px;border-radius:999px;background:#f2f2ef;font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:0;border-radius:10px;padding:9px 12px;cursor:pointer;background:#ecece8}
.primary{background:#202020;color:white}
.fab{position:fixed;right:24px;bottom:24px;width:56px;height:56px;border-radius:50%;border:0;background:#202020;color:#fff;font-size:25px;box-shadow:0 8px 25px #0003;cursor:pointer}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:18px}
.modal.open{display:flex}
.modalbox{background:white;border-radius:20px;padding:22px;width:min(460px,100%)}
label{display:block;font-size:13px;color:#666;margin:12px 0 5px}
input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:10px;cursor:pointer}
.tab.active{background:#202020;color:#fff}
.empty{color:#888;text-align:center;padding:28px}
.error{color:#b42318;font-size:13px;margin-top:10px}
.auth{max-width:420px;margin:12vh auto;padding:22px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="auth" class="auth card">
  <h1>오늘의 루틴</h1>
  <p class="date">루틴과 일정을 한 화면에서 관리해요.</p>
  <label>이메일</label>
  <input id="email" type="email" placeholder="you@example.com">
  <label>비밀번호</label>
  <input id="password" type="password" placeholder="6자 이상">
  <div class="actions">
    <button class="btn primary" onclick="signIn()">로그인</button>
    <button class="btn" onclick="signUp()">회원가입</button>
  </div>
  <div id="authMsg" class="error"></div>
</div>
<main id="app" class="app hidden">
  <header>
    <div><h1>오늘의 루틴</h1><div id="today" class="date"></div></div>
    <button class="btn" onclick="signOut()">로그아웃</button>
  </header>
  <div class="tabs">
    <button class="tab active" onclick="showTab('todayTab',this)">오늘</button>
    <button class="tab" onclick="showTab('statsTab',this)">통계</button>
  </div>
  <section id="todayTab">
    <div class="card"><div class="date">오늘의 루틴 달성률</div><div id="score" class="score">0%</div></div>
    <div id="timeline" class="card timeline"></div>
  </section>
  <section id="statsTab" class="hidden">
    <div class="card"><h3>최근 7일</h3><div id="stats"></div></div>
  </section>
</main>
<button id="fab" class="fab hidden" onclick="openModal()">+</button>
<div id="modal" class="modal">
  <div class="modalbox">
    <h2>추가</h2>
    <label>종류</label>
    <select id="kind" onchange="toggleFields()">
      <option value="routine">루틴</option>
      <option value="schedule">일정</option>
    </select>
    <label>이름</label>
    <input id="name" placeholder="예: 운동 / 친구와 저녁">
    <div id="routineFields">
      <label>시간</label>
      <input id="rtime" type="time" value="18:30">
      <label>반복</label>
      <select id="repeat">
        <option value="daily">매일</option>
        <option value="weekdays">평일</option>
        <option value="weekends">주말</option>
      </select>
    </div>
    <div id="scheduleFields" class="hidden">
      <label>날짜</label>
      <input id="sdate" type="date">
      <label>시작</label>
      <input id="stime" type="time" value="18:00">
      <label>종료</label>
      <input id="etime" type="time" value="20:00">
    </div>
    <div class="actions">
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn primary" onclick="saveItem()">저장</button>
    </div>
    <div id="modalMsg" class="error"></div>
  </div>
</div>
<script>
const SUPABASE_URL = "https://mtwbkypkhmaxafqbigpc.supabase.co";
const SUPABASE_KEY = "sb_publishable_AUCv5Ggnlr0bErHC0uLtDg_6G2Utj3D";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let user = null;
let routines = [];
let schedules = [];
let records = [];

const isoToday = () => new Date().toISOString().slice(0,10);
const fmtDate = (d) => new Intl.DateTimeFormat('ko-KR', {year:'numeric', month:'long', day:'numeric', weekday:'long'}).format(d);
const esc = (s) => (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;'}[m]));

async function signIn(){
  const emailVal = document.getElementById('email').value;
  const passVal = document.getElementById('password').value;
  const {error} = await sb.auth.signInWithPassword({ email:emailVal, password:passVal });
  document.getElementById('authMsg').textContent = error ? error.message : "";
  if(!error) enter(sb.auth.user());
}

async function signUp(){
  const emailVal = document.getElementById('email').value;
  const passVal = document.getElementById('password').value;
  const {error} = await sb.auth.signUp({ email:emailVal, password:passVal });
  document.getElementById('authMsg').textContent = error ? error.message : "가입 완료.";
}

async function signOut(){
  await sb.auth.signOut();
  leave();
}

function enter(u){
  user = u;
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('fab').classList.remove('hidden');
  document.getElementById('today').textContent = fmtDate(new Date());
  loadToday();
}

function leave(){
  user = null;
  document.getElementById('auth').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('fab').classList.add('hidden');
}

async function loadToday(){
  const day = isoToday();
  const dow = new Date().getDay();
  const r = await sb.from('routines').select('*').eq('user_id',user.id).eq('active',true).order('scheduled_time');
  const s = await sb.from('schedules').select('*').eq('user_id',user.id).eq('schedule_date',day).order('start_time');
  const rec = await sb.from('routine_records').select('*').eq('user_id',user.id).eq('scheduled_date',day);
  if(r.error || s.error || rec.error) return;
  routines = r.data || [];
  schedules = s.data || [];
  records = rec.data || [];
  render(day,dow);
}

function applies(r,dow){
  if(r.repeat_type === 'daily') return true;
  if(r.repeat_type === 'weekdays' && dow >= 1 && dow <= 5) return true;
  if(r.repeat_type === 'weekends' && (dow === 0 || dow === 6)) return true;
  if(r.repeat_type === 'custom' && (r.repeat_days || []).includes(dow)) return true;
  return false;
}

function render(day,dow){
  let items = [];
  routines.filter(r => applies(r,dow)).forEach(r => {
    let rec = records.find(x => x.routine_id === r.id);
    items.push({ time: rec?.actual_scheduled_time || r.scheduled_time, type:'routine', r, rec });
  });
  schedules.forEach(s => items.push({ time:s.start_time, type:'schedule', s }));
  items.sort((a,b) => a.time.localeCompare(b.time));

  const conflicts = [];
  routines.filter(r => applies(r,dow)).forEach(r => {
    const rec = records.find(x => x.routine_id === r.id);
    const rt = rec?.actual_scheduled_time || r.scheduled_time;
    schedules.forEach(s => { if(rt >= s.start_time && rt < s.end_time) conflicts.push({ r, s, rec }); });
  });

  const conflictHtml = conflicts.length ? `<div class="card" style="margin:0 0 12px; border-color:#ddd2a8; background:#fffdf3">
    <div style="font-weight:700; margin-bottom:8px">⚠️ 일정과 겹치는 루틴이 있어요</div>
    ${conflicts.map(c => `<div style="padding:10px 0; border-top:1px solid #eee">
      <b>${esc(c.r.name)}</b> · ${c.r.scheduled_time.slice(0,5)}
      <div class="meta">📅 ${esc(c.s.title)} (${c.s.start_time.slice(0,5)} – ${c.s.end_time.slice(0,5)})</div>
      <div class="actions">
        <button class="btn primary" onclick="rescheduleAfter('${c.r.id}','${c.s.end_time}')">일정 이후로 옮기기</button>
        <button class="btn" onclick="skipToday('${c.r.id}')">오늘만 쉬기</button>
      </div>
    </div>`).join('')}</div>` : '';

  document.getElementById('timeline').innerHTML = conflictHtml + (items.length ? items.map(renderItem).join('') : `<div class="empty">아직 오늘의 루틴이나 일정이 없어요.</div>`);
  const active = routines.filter(r => applies(r,dow));
  const done = active.filter(r => records.find(x => x.routine_id === r.id)?.status === 'completed').length;
  document.getElementById('score').textContent = (active.length ? Math.round(done / active.length * 100) : 0) + '%';
}

function renderItem(x){
  if(x.type === 'schedule') return `<div class="item"><div class="time">${x.time.slice(0,5)}</div><div><div class="item-title">📅 ${esc(x.s.title)}</div><div class="meta">${x.s.start_time.slice(0,5)} – ${x.s.end_time.slice(0,5)}</div></div></div>`;
  const status = x.rec?.status || 'scheduled';
  let actions = (status !== 'completed' && status !== 'skipped') ? `<div class="actions">
    <button class="btn primary" onclick="completeRoutine('${x.r.id}')">완료</button>
    <button class="btn" onclick="skipToday('${x.r.id}')">오늘만 쉬기</button>
  </div>` : '';
  return `<div class="item"><div class="time">${(x.time || x.r.scheduled_time).slice(0,5)}</div><div>
    <div class="item-title">${esc(x.r.icon || '✓')} ${esc(x.r.name)}</div>
    <div class="meta">${status === 'completed' ? '완료' : status === 'skipped' ? '오늘만 쉬기' : '예정'}</div>
    ${status === 'skipped' ? '<span class="badge">일정으로 쉬었어요</span>' : ''}
    ${actions}
  </div></div>`;
}

async function ensureRecord(r) {
  const today = isoToday();
  let { data: existing } = await sb.from('routine_records').select('*').eq('user_id', user.id).eq('routine_id', r.id).eq('scheduled_date', today).single();
  if (existing) return existing;
  const payload = { user_id: user.id, routine_id: r.id, scheduled_date: today, original_scheduled_time: r.scheduled_time, status: 'scheduled' };
  const { data, error } = await sb.from('routine_records').insert(payload).select().single();
  if (error) return null;
  records.push(data);
  return data;
}

async function rescheduleAfter(id, endTime){
  const r = routines.find(x => x.id === id);
  if(!r) return;
  let rec = await ensureRecord(r);
  if(!rec) return;
  const [h,m] = endTime.split(':').map(Number);
  const mins = h * 60 + m + 30;
  const newTime = `${String(Math.floor((mins % 1440) / 60)).padStart(2,'0')}:${String(mins % 60).padStart(2,'0')}:00`;
  await sb.from('routine_records').update({ actual_scheduled_time:newTime, status:'rescheduled', adjusted:true, adjustment_reason:'schedule_conflict' }).eq('id',rec.id);
  loadToday();
}

async function completeRoutine(id){
  let r = routines.find(x => x.id === id);
  let rec = await ensureRecord(r);
  if(!rec) return;
  await sb.from('routine_records').update({ completed:true, completed_at: new Date().toISOString(), status:'completed' }).eq('id',rec.id);
  loadToday();
}

async function skipToday(id){
  let r = routines.find(x => x.id === id);
  let rec = await ensureRecord(r);
  if(!rec) return;
  await sb.from('routine_records').update({ status:'skipped', adjusted:true, adjustment_reason:'user_skip_today' }).eq('id',rec.id);
  loadToday();
}

window.showTab = function(id,el){
  document.querySelectorAll('.tabs .tab').forEach(x => x.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('#todayTab,#statsTab').forEach(x => x.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  if(id==='statsTab') loadStats();
};
window.openModal = function(){ document.getElementById('modal').classList.add('open'); document.getElementById('sdate').value = isoToday(); };
window.closeModal = function(){ document.getElementById('modal').classList.remove('open'); };
window.toggleFields = function(){
  document.getElementById('routineFields').classList.toggle('hidden', document.getElementById('kind').value !== 'routine');
  document.getElementById('scheduleFields').classList.toggle('hidden', document.getElementById('kind').value !== 'schedule');
};

async function saveItem(){
  const nameVal = document.getElementById('name').value.trim();
  if(!nameVal){ alert('이름을 입력해주세요.'); return; }
  if(document.getElementById('kind').value === 'routine'){
    await sb.from('routines').insert({ user_id:user.id, name:nameVal, scheduled_time:document.getElementById('rtime').value, repeat_type:document.getElementById('repeat').value, notification_enabled:true, active:true });
  }else{
    await sb.from('schedules').insert({ user_id:user.id, title:nameVal, schedule_date:document.getElementById('sdate').value, start_time:document.getElementById('stime').value, end_time:document.getElementById('etime').value });
  }
  document.getElementById('name').value = '';
  closeModal();
  loadToday();
}

async function loadStats(){
  const from = new Date(Date.now() - 6 * 86400000).toISOString().slice(0,10);
  const { data, error } = await sb.from('routine_records').select('scheduled_date,status').eq('user_id',user.id).gte('scheduled_date',from).order('scheduled_date');
  if(error) return;
  const map = {};
  (data || []).forEach(x => {
    map[x.scheduled_date] ??= { completed:0, adjusted:0, missed:0 };
    if(x.status === 'completed') map[x.scheduled_date].completed++;
    else if(x.status === 'skipped' || x.status === 'rescheduled') map[x.scheduled_date].adjusted++;
    else if(x.status === 'missed') map[x.scheduled_date].missed++;
  });
  document.getElementById('stats').innerHTML = Object.keys(map).length ? Object.entries(map).map(([d,v]) => `<p><b>${d}</b> · 완료 ${v.completed} · 조정 ${v.adjusted} · 미완료 ${v.missed}</p>`).join('') : `<div class="empty">아직 기록이 없어요.</div>`;
}

sb.auth.getSession().then(({data:{session}}) => { if(session) enter(session.user); });
sb.auth.onAuthStateChange((_e,s) => s ? enter(s.user) : leave());
</script>
</body>
</html>
